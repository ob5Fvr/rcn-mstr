[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rcn-mstr"
version = "1.0.0"
description = "Modular asynchronous recon framework producing raw, AI-ingestible bug-bounty recon data"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["aiohttp>=3.8"]
keywords = ["recon", "bug-bounty", "security", "osint", "subdomain", "attack-surface", "dns"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.optional-dependencies]
tls = ["cryptography>=3.4"]
dev = ["pytest>=7", "pytest-asyncio>=0.21", "cryptography>=3.4"]

[project.scripts]
rcn-mstr = "rcnmstr.cli:main"

[tool.setuptools.packages.find]
include = ["rcnmstr*"]

[tool.setuptools.package-data]
rcnmstr = ["data/*.json", "data/*.txt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
